project:
  name: explanation_disagreement_audit
  data_year: 2018
  source_state: CA
  target_states: [TX, NY]
  tasks: [ACSIncome, ACSPublicCoverage]
  seeds: [11, 23, 37]
  n_members: 5
  train_limit: 30000
  explanation_limit: 3000
  sh_train_background: 100
  sh_pilot_records: 200
  coverage_primary: 0.20
  coverage_secondary: [0.05, 0.10, 0.30]
  bootstrap_reps: 1000
  split_seed: 20260909
  sampling_seed: 20260909
  bootstrap_seed: 20260910
  random_policy_seed: 314159
  robustness_background_limit: 500
  fairness_min_group_size: 100
  vote_threshold: 0.5
  review_rounding: half_up
  review_tie_breaker: record_key_ascending
  xgb:
    n_estimators: 200
    max_depth: 3
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    random_state_offset: 1000
  selector_grid:
    C: [0.01, 0.1, 1.0, 10.0]
  shap:
    feature_perturbation: interventional
    model_output: probability
    grouping: original_variable
    l1_epsilon: 1.0e-8
    reconstruction_tolerance: 1.0e-4
